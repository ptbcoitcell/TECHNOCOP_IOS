name: Build TECHNOCOP iOS (macOS Runner)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App & Simulator Bundle
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build for iOS Simulator (For Appetize.io / Simulator Testing)
        run: |
          xcodebuild clean build \
            -project ios/Technocop.xcodeproj \
            -scheme Technocop \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="${{ github.workspace }}/build/simulator"

      - name: Compress Simulator App (Ready for Web Simulator / Appetize.io)
        run: |
          cd "${{ github.workspace }}/build/simulator"
          zip -r -X "${{ github.workspace }}/Technocop-Simulator.zip" Technocop.app

      - name: Build Unsigned IPA for Device Sideloading (Windows USB install)
        run: |
          mkdir -p "${{ github.workspace }}/build/Payload"
          cp -R "${{ github.workspace }}/build/simulator/Technocop.app" "${{ github.workspace }}/build/Payload/"
          cd "${{ github.workspace }}/build"
          zip -r -X "${{ github.workspace }}/Technocop-Unsigned.ipa" Payload

      - name: Upload Simulator Build (For Browser / Simulator Testing)
        uses: actions/upload-artifact@v4
        with:
          name: Technocop-Simulator
          path: Technocop-Simulator.zip

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Technocop-Unsigned-IPA
          path: Technocop-Unsigned.ipa
