name: Build TECHNOCOP iOS (macOS Runner)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App & Simulator Bundle
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Xcode Version
        run: |
          xcodebuild -version

      # 1. BUILD FOR WEB SIMULATOR (Appetize.io / Simulator)
      - name: Build for iOS Simulator
        run: |
          xcodebuild clean build \
            -project ios/Technocop.xcodeproj \
            -scheme Technocop \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="${{ github.workspace }}/build/simulator"

      # 2. BUILD REAL ARM64 BINARY FOR PHYSICAL IPHONE DEVICE (Sideloadly / AltStore)
      - name: Build for Physical iOS Device (ARM64)
        run: |
          xcodebuild clean build \
            -project ios/Technocop.xcodeproj \
            -scheme Technocop \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="${{ github.workspace }}/build/device"

      - name: Package Physical Device IPA
        run: |
          mkdir -p "${{ github.workspace }}/build/device-payload/Payload"
          cp -R "${{ github.workspace }}/build/device/Technocop.app" "${{ github.workspace }}/build/device-payload/Payload/"
          cd "${{ github.workspace }}/build/device-payload"
          zip -r -X "${{ github.workspace }}/Technocop-Device.ipa" Payload

      # UPLOAD ARTIFACTS
      - name: Upload Web Simulator Bundle (Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: Technocop-Simulator
          path: build/simulator/Technocop.app

      - name: Upload Physical Device IPA (For Sideloadly on iPhone)
        uses: actions/upload-artifact@v4
        with:
          name: Technocop-Device-IPA
          path: Technocop-Device.ipa
